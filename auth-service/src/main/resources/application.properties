server.port=8085
spring.application.name=auth-service

# JWT Configuration
# In production, load from environment variable: ${JWT_SECRET}
jwt.secret=mySuperSecretKeyForJwtSigningThatIsLongEnoughToMeetTheHmacShaRequirement12345
jwt.expiration=3600000

# Downstream Services
user-service.url=http://localhost:8084
role-service.url=http://localhost:8082

# H2 Database (for future token blacklist)
spring.datasource.url=jdbc:h2:mem:auth-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
