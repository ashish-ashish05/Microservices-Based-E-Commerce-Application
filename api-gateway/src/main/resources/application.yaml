server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/products/**
        - id: category-service
          uri: http://localhost:8082
          predicates:
            - Path=/categories/**
        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/inventory/**

jwt:
  secret: "your-very-long-and-secure-secret-key-that-must-be-at-least-32-characters"

gateway:
  security:
    public-routes: "/auth/**,/users/register"

management:
  endpoints:
    web:
      exposure:
        include: health,info