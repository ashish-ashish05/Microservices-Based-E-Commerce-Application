server.port=8085
spring.application.name=order-service
# Remote Service URLs - Corrected to remove http:// prefix as Feign handles it or it's redundant in some configs,
# but actually the error was "http://${services.cart.url} is malformed" because the value was missing or not resolved.
# Let's provide absolute URLs.
services.cart.url=http://localhost:8086
services.inventory.url=http://localhost:8083
services.payment.url=http://localhost:8087
services.shipping.url=http://localhost:8088

spring.datasource.url=jdbc:h2:mem:order-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
